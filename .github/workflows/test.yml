name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: bash docs/check-docs.sh
      - run: bash docs/check-docs-selftest.sh
      - name: Every action is pinned to a commit SHA
        run: |
          if grep -nE '^\s*(-\s*)?uses:' .github/workflows/*.yml | grep -vE 'uses: [^@[:space:]]+@[0-9a-f]{40} # v[0-9]'; then
            echo "pin these actions to a full commit SHA with a version comment"; exit 1
          fi
      - name: The e2e harness work directory is new and private (test/e2e/run.sh)
        run: bash test/e2e/workdir-selftest.sh
      - name: Every source file carries the MPL-2.0 header (CONTRIBUTING.md)
        run: |
          missing=$(git ls-files -- '*.js' '*.mjs' '*.go' '*.sh' '*.css' '*.html' '*.py' '*.yml' '*.yaml' '*.iss' ':!addon/test/fixtures' ':!test/e2e/fixtures' | xargs grep -L 'mozilla.org/MPL/2.0' || true)
          if [ -n "$missing" ]; then
            echo "$missing"; echo "add the MPL-2.0 header to these files"; exit 1
          fi

  addon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addon
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: addon/package-lock.json
      - run: npm ci
      - run: npm test

  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: host
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - run: go test ./...
      - name: THIRD_PARTY_LICENSES matches go.mod
        if: runner.os == 'Linux'
        run: sh ../packaging/third-party-licenses.sh --check
      - name: third-party-licenses.sh handles replaced modules and several licence files
        if: runner.os == 'Linux'
        run: sh ../packaging/third-party-licenses-selftest.sh
      # The standard library comes from the toolchain named in go.mod, so a
      # toolchain that no longer gets security fixes fails here too.
      - name: No known vulnerability reachable from the host, on any system
        if: runner.os == 'Linux'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          for os in linux windows darwin; do
            echo "GOOS=$os"
            GOOS=$os "$(go env GOPATH)/bin/govulncheck" ./...
          done
      # The Windows-only tests (owner-only DACLs, HKCU registration) must
      # really run there, not be skipped or filtered out.
      - name: Windows-only tests ran
        if: runner.os == 'Windows'
        run: |
          go test -count=1 -v -run 'TestWindowsACLOwnerOnly|TestWindowsRegistry|TestOwnerOnlyWindows|TestSavePrivateWindows' ./... | tee win.log
          for t in TestWindowsACLOwnerOnly TestWindowsRegistry TestOwnerOnlyWindows TestSavePrivateWindows; do
            grep -q -- "--- PASS: $t " win.log || { echo "$t did not pass"; exit 1; }
          done
