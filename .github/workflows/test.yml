name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh docs/check-docs.sh

  addon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: addon/package-lock.json
      - run: npm ci
      - run: npm test

  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: host
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - run: go test ./...
      # The Windows-only tests (owner-only DACLs, HKCU registration) must
      # really run there, not be skipped or filtered out.
      - name: Windows-only tests ran
        if: runner.os == 'Windows'
        run: |
          go test -count=1 -v -run 'TestWindowsACLOwnerOnly|TestWindowsRegistry|TestOwnerOnlyWindows|TestSavePrivateWindows' ./... | tee win.log
          for t in TestWindowsACLOwnerOnly TestWindowsRegistry TestOwnerOnlyWindows TestSavePrivateWindows; do
            grep -q -- "--- PASS: $t " win.log || { echo "$t did not pass"; exit 1; }
          done
