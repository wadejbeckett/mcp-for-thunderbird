name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash docs/check-docs.sh
      - run: bash docs/check-docs-selftest.sh
      - name: Every action is pinned to a commit SHA
        run: |
          if grep -nE '^\s*(-\s*)?uses:' .github/workflows/*.yml | grep -vE 'uses: [^@[:space:]]+@[0-9a-f]{40} # v[0-9]'; then
            echo "pin these actions to a full commit SHA with a version comment"; exit 1
          fi

  addon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addon
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: addon/package-lock.json
      - run: npm ci
      - run: npm test

  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: host
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - run: go test ./...
      # The Windows-only tests (owner-only DACLs, HKCU registration) must
      # really run there, not be skipped or filtered out.
      - name: Windows-only tests ran
        if: runner.os == 'Windows'
        run: |
          go test -count=1 -v -run 'TestWindowsACLOwnerOnly|TestWindowsRegistry|TestOwnerOnlyWindows|TestSavePrivateWindows' ./... | tee win.log
          for t in TestWindowsACLOwnerOnly TestWindowsRegistry TestOwnerOnlyWindows TestSavePrivateWindows; do
            grep -q -- "--- PASS: $t " win.log || { echo "$t did not pass"; exit 1; }
          done
