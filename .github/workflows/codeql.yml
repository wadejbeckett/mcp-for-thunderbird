#
# CodeQL code scanning of the host (Go, host/ and test/e2e/) and the
# add-on and packaging scripts (JavaScript). Findings appear in the
# repository's Security tab.

name: codeql

on:
  push:
    branches: [v1, main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the results to code scanning
      contents: read
      actions: read # read workflow run details on a private repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript
            build-mode: none
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: host/go.mod
          cache: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      # Both Go modules, with their tests, are compiled so CodeQL sees them.
      - name: Build the Go modules and their tests
        if: matrix.language == 'go'
        run: |
          (cd host && go build ./... && go test -c -o "$RUNNER_TEMP/host-tests/" ./...)
          (cd test/e2e && go test -c -o "$RUNNER_TEMP/e2e.test" .)
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
