#
# OpenSSF Scorecard: checks the repository's supply-chain practices
# (pinned dependencies, token permissions, branch protection and more),
# publishes the result to the OpenSSF API and uploads it to code scanning.
# Scorecard accepts published results only from a workflow without
# workflow-level env, defaults or write permissions, whose job uses only
# the actions below.

name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 6" # weekly, Saturday 03:41 UTC
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the results to code scanning
      id-token: write # publish the results to the OpenSSF API
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
