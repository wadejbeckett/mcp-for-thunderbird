#
# Linux end-to-end tests (test/e2e/run.sh) on the oldest Thunderbird the
# add-on supports, 140 ESR, and on the current release, each unpacked from
# Mozilla's own Linux tarball under xvfb. GreenMail runs in Docker on
# 127.0.0.1; Thunderbird runs with a throwaway profile and home on the
# throwaway runner. Nothing is installed but the libraries Thunderbird needs.
#
# It runs on every release tag (vX.Y.Z) too, so each release has a Linux
# end-to-end run for the tagged commit (CONTRIBUTING.md, Releasing).
#
# To move to newer Thunderbird versions, change `version` and `sha256` in
# the matrix below. The version is the release folder name on
# https://archive.mozilla.org/pub/thunderbird/releases/ (140.x.yesr for
# the ESR, the newest plain number for the release). The hash is the
# "linux-x86_64/en-US/thunderbird-<version>.tar.xz" line of that folder's
# SHA256SUMS. fetch-thunderbird.sh checks the tarball against both.

name: e2e-linux

on:
  workflow_dispatch:
  pull_request:
    paths:
      - host/**
      - addon/**
      - packaging/build-xpi.mjs
      - test/e2e/**
      - .github/workflows/e2e-linux.yml
  push:
    branches: [v1]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"] # path filters do not apply to tag pushes
    paths:
      - host/**
      - addon/**
      - packaging/build-xpi.mjs
      - test/e2e/**
      - .github/workflows/e2e-linux.yml

permissions:
  contents: read

concurrency:
  group: e2e-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Thunderbird ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Thunderbird 140 ESR, the oldest supported version.
          - version: 140.17.0esr
            sha256: 217edda8359412f13d76765802ed946b94b3cf95db5a4c8d9386f1f62f9391de
          # The current release.
          - version: "159.0"
            sha256: a7cb57c4dfec66e566e1cbbdcf7e0aab67aad7262dd0ab38b4f4e8df2b771074
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: test/e2e/go.mod
          cache: false # it runs on release tags too; no shared cache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Libraries Thunderbird needs, and xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0t64 libasound2t64 libx11-xcb1
      - name: Thunderbird ${{ matrix.version }} from Mozilla, checked against SHA256SUMS
        id: tb
        run: |
          tb=$(test/e2e/fetch-thunderbird.sh "${{ matrix.version }}" "$RUNNER_TEMP/mft-e2e-tb" "${{ matrix.sha256 }}")
          echo "path=$tb" >>"$GITHUB_OUTPUT"
      - name: End-to-end tests
        env:
          TMPDIR: ${{ runner.temp }}
          MFT_E2E_THUNDERBIRD: ${{ steps.tb.outputs.path }}
          # The work directory is kept, so that Thunderbird's output (the
          # add-on's console, tb.out) can be uploaded when a test fails.
          MFT_E2E_DIR: ${{ runner.temp }}/mft-e2e-work
          MFT_E2E_KEEP: "1"
        run: test/e2e/run.sh -v
      - name: Thunderbird's output, for a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-thunderbird-${{ matrix.version }}
          path: ${{ runner.temp }}/mft-e2e-work/tb.out
          if-no-files-found: ignore
          retention-days: 7
