#
# Windows and macOS validation (docs/PLATFORMS.md): build the release
# artefacts, build and exercise the Windows installer and the macOS pkg on
# their own runners, add both to SHA256SUMS, and run the end-to-end tests
# against Thunderbird with the host installed by those installers.
# Everything installed here is installed on the throwaway runner only.
#
# A push of a release tag (vX.Y.Z) runs the same jobs in release mode: the
# release job (in place of build) has GoReleaser create a draft GitHub
# release with the archives, .deb, .xpi, .mcpb, SBOMs and SHA256SUMS, and
# the sums job adds the Windows installers and the macOS pkg to SHA256SUMS
# and checks everything again; the publish job then uploads them to that
# draft. The release job refuses a tag that already has a release, draft or
# published, and records the id of the draft it created; every later upload
# or deletion acts on that id only, and only while it is still a draft.
# When the release job or one of its checks fails, its draft is deleted and
# the tag is kept. When release succeeded and a later job failed, the draft
# stays, so "Re-run failed jobs" can finish it. The release stays a draft
# until the maintainer checks the end-to-end jobs and publishes it
# (CONTRIBUTING.md, Releasing). Only the release and publish jobs, which run
# only on a tag push, may write to the repository.

name: platforms

on:
  workflow_dispatch:
    inputs:
      reuse_run:
        description: "Run id whose dist-win and dist-mac artifacts the e2e jobs reuse (skips the build jobs)"
        default: ""
      e2e:
        description: "End-to-end jobs to run"
        type: choice
        options: [both, windows, macos]
        default: both
      e2e_tests:
        description: "go test -run pattern for the end-to-end jobs (empty: TestE2ERead$|TestE2EOrganise$)"
        default: ""
  push:
    branches: [v1]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"] # path filters do not apply to tag pushes
    paths:
      - host/**
      - addon/**
      - packaging/**
      - test/e2e/**
      - .github/workflows/platforms.yml

permissions:
  contents: read
  actions: read # download-artifact from an earlier run (reuse_run)

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

env:
  # GreenMail standalone 2.1.14 from Maven Central (com.icegreen), the
  # version of the Docker image the Linux e2e uses; SHA-256 as Maven
  # Central publishes it.
  GREENMAIL_URL: https://repo1.maven.org/maven2/com/icegreen/greenmail-standalone/2.1.14/greenmail-standalone-2.1.14.jar
  GREENMAIL_SHA256: 0381392f3a44e4d8ae78051778440f58820d01acaf5757c3f43649deda8c1d23
  # Inno Setup from Chocolatey, the version the runner image carried when
  # it was pinned.
  INNOSETUP_VERSION: "6.7.1"

jobs:
  # Branch pushes and runs by hand: a snapshot, with read-only access.
  build:
    if: ${{ !inputs.reuse_run && !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: host/go.mod
          cache: false # this workflow also builds releases; no shared cache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: GoReleaser snapshot, check.sh and its self-test
        run: sh packaging/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  # A release tag: the draft release. The only build that may write.
  release:
    if: ${{ !inputs.reuse_run && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # GoReleaser creates the draft release
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: host/go.mod
          cache: false # a release is built without a cache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      # GoReleaser (draft: true) adds a second draft when a release with
      # this tag exists, and the steps below must only ever act on the draft
      # this run creates, so an existing release of any kind stops the job.
      - name: Refuse a tag that already has a release
        id: no-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          found=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.tag_name == env.TAG) | "\(.id) draft=\(.draft)"')
          if [ -n "$found" ]; then
            echo "::error::$TAG already has a release (delete it by hand, or tag a new version):"
            echo "$found"
            exit 1
          fi
          echo "no release has the tag $TAG"
      - name: GoReleaser draft release, check.sh and its self-test
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sh packaging/build.sh --clean
      # Runs when GoReleaser or a check failed too: the deletion below needs
      # the id. The tag had no release before GoReleaser ran, so the one
      # release it has now is this run's draft.
      - name: Record the id of the draft release this run created
        id: draft
        if: ${{ always() && steps.no-release.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          found=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.tag_name == env.TAG) | "\(.id) \(.draft)"')
          count=$(printf '%s' "$found" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::want one release with the tag $TAG, found $count; no id recorded"
            exit 1
          fi
          id=${found%% *}
          if [ "${found#* }" != true ]; then
            echo "::error::release $id of $TAG is not a draft; no id recorded"
            exit 1
          fi
          echo "id=$id" >>"$GITHUB_OUTPUT"
          echo "draft release $id of $TAG"
      # GoReleaser uploads the draft before check.sh runs: a draft holding
      # artefacts that check.sh rejected must not stay. The tag stays.
      - name: Delete this run's draft release when the build or a check failed
        if: ${{ failure() || cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          set -eu
          if [ -z "$RELEASE_ID" ]; then
            echo "no draft release recorded by this run; nothing deleted"
            exit 0
          fi
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .draft || echo missing)
          if [ "$draft" = true ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
            echo "deleted the draft release $RELEASE_ID; the tag is kept"
          else
            echo "release $RELEASE_ID is not a draft ($draft); nothing deleted"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  windows-installer:
    needs: [build, release]
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.release.result == 'success') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      # Inno Setup is pinned: --allow-downgrade replaces a newer copy the
      # runner image may carry.
      - name: Install Inno Setup ${{ env.INNOSETUP_VERSION }} (runner only)
        run: choco install innosetup --version $env:INNOSETUP_VERSION --allow-downgrade -y --no-progress
      - name: Compile installer.iss (amd64 and arm64)
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          # ISCC.exe carries no file version, so ask Chocolatey what it installed.
          $installed = choco list --exact innosetup --limit-output
          "installed: $installed"
          if ($installed -ne "innosetup|$env:INNOSETUP_VERSION") { throw "Inno Setup '$installed', want $env:INNOSETUP_VERSION" }
          $version = (Get-Content dist/metadata.json | ConvertFrom-Json).version
          foreach ($arch in 'amd64', 'arm64') {
            $src = (Get-ChildItem dist -Directory -Filter "host_windows_${arch}*" | Select-Object -First 1).FullName
            & $iscc /Q "/DAppVersion=$version" "/DArch=$arch" "/DSourceDir=$src" "/DDocDir=$pwd" "/DOutputDir=$pwd\dist-win" packaging\windows\installer.iss
            if ($LASTEXITCODE -ne 0) { throw "iscc $arch exited $LASTEXITCODE" }
          }
          Get-ChildItem dist-win | Format-Table Name, Length
      - name: Silent install registers the host; uninstall removes it
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem dist-win -Filter '*-windows-amd64-setup.exe').FullName
          $app = "$env:LOCALAPPDATA\Programs\MCP for Thunderbird"
          $exe = "$app\mcp-for-thunderbird.exe"
          $manifest = "$app\mcp_for_thunderbird.json"
          $key = 'HKCU:\Software\Mozilla\NativeMessagingHosts\mcp_for_thunderbird'

          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/LOG=install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log; throw "setup exited $($p.ExitCode)" }
          & $exe version
          $value = (Get-Item $key).GetValue('')
          "HKCU key: $value"
          if ($value -ne $manifest) { throw "registry value '$value', want '$manifest'" }
          $m = Get-Content $manifest -Raw | ConvertFrom-Json
          "manifest: $($m | ConvertTo-Json -Compress)"
          if ($m.path -ne $exe -or $m.name -ne 'mcp_for_thunderbird' -or $m.allowed_extensions[0] -ne 'mcp-for-thunderbird@wadejbeckett.github.io') { throw "manifest content" }
          # The licences of the linked Go modules travel with the program.
          foreach ($f in 'LICENSE', 'NOTICE', 'THIRD_PARTY_LICENSES') {
            if (-not (Test-Path -PathType Leaf "$app\$f")) { throw "the installed app folder lacks $f" }
          }
          "installed: LICENSE, NOTICE and THIRD_PARTY_LICENSES next to the program"

          # The uninstaller hands over to a copy of itself; wait for the files to go.
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          for ($i = 0; $i -lt 120 -and (Test-Path $exe); $i++) { Start-Sleep 1 }
          if (Test-Path $exe) { throw "uninstall left $exe" }
          if (Test-Path $manifest) { throw "uninstall left the manifest" }
          if (Test-Path $key) { throw "uninstall left the registry key" }
          "uninstall: program, manifest and HKCU key removed"
      - name: A registration failure makes Setup exit 100
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem dist-win -Filter '*-windows-amd64-setup.exe').FullName
          $app = "$env:LOCALAPPDATA\Programs\MCP for Thunderbird"
          # A folder where the manifest goes makes `setup --native-only` fail.
          New-Item -ItemType Directory -Force "$app\mcp_for_thunderbird.json\block" | Out-Null
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/LOG=fail.log' -Wait -PassThru
          "exit code: $($p.ExitCode)"
          Select-String -Path fail.log -Pattern 'setup --native-only failed'
          if ($p.ExitCode -ne 100) { Get-Content fail.log; throw "want exit code 100, got $($p.ExitCode)" }
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          for ($i = 0; $i -lt 120 -and (Test-Path "$app\mcp-for-thunderbird.exe"); $i++) { Start-Sleep 1 }
          Remove-Item -Recurse -Force $app -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-win
          path: dist-win/
          retention-days: 7

  macos-pkg:
    needs: [build, release]
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.release.result == 'success') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Build the pkg
        run: |
          set -eu
          version=$(python3 -c 'import json; print(json.load(open("dist/metadata.json"))["version"])')
          bin=$(ls dist/*darwin_all/mcp-for-thunderbird)
          chmod +x "$bin" # artifacts lose the execute bit
          lipo -archs "$bin"
          sh packaging/macos/build-pkg.sh "$version" "$bin" dist-mac
          pkgutil --payload-files dist-mac/*.pkg | tee payload.txt
          # The licences of the linked Go modules travel with the program.
          for f in mcp-for-thunderbird LICENSE NOTICE THIRD_PARTY_LICENSES; do
            grep -qxE "(\./)?$f" payload.txt || { echo "the pkg payload lacks $f"; exit 1; }
          done
      - name: Install for the current user; check ownership and registration
        run: |
          set -eu
          installer -pkg dist-mac/*.pkg -target CurrentUserHomeDirectory
          me=$(id -un)
          app="$HOME/Library/Application Support/MCP for Thunderbird"
          # Thunderbird's per-user folder (not Firefox's Application Support one).
          manifest="$HOME/Library/Mozilla/NativeMessagingHosts/mcp_for_thunderbird.json"
          ls -la "$app" "$manifest"
          [ -f "$app/THIRD_PARTY_LICENSES" ] || { echo "$app lacks THIRD_PARTY_LICENSES"; exit 1; }
          for f in "$app" "$app"/* "$manifest"; do
            owner=$(stat -f %Su "$f")
            [ "$owner" = "$me" ] || { echo "$f is owned by $owner, not $me"; exit 1; }
          done
          python3 - "$manifest" "$app/mcp-for-thunderbird" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          print("manifest:", json.dumps(m))
          assert m["path"] == sys.argv[2], m["path"]
          assert m["allowed_extensions"] == ["mcp-for-thunderbird@wadejbeckett.github.io"]
          PY
          "$app/mcp-for-thunderbird" version
          echo "installed for $me, payload and manifest owned by $me"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-mac
          path: dist-mac/
          retention-days: 7

  sums:
    needs: [windows-installer, macos-pkg]
    # build or release is always skipped, and a skipped job further up
    # skips a job with no condition, so the condition is explicit.
    if: ${{ !cancelled() && needs.windows-installer.result == 'success' && needs.macos-pkg.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artefacts
      - name: Add the installers and the pkg to SHA256SUMS
        run: |
          set -eu
          mv artefacts/dist dist
          chmod +x dist/host_*/mcp-for-thunderbird* # artifacts lose the execute bit
          cp artefacts/dist-win/*.exe artefacts/dist-mac/*.pkg dist/
          sh packaging/add-sums.sh dist dist/*-setup.exe dist/*-macos.pkg
          sh packaging/check.sh dist
          grep -E 'setup\.exe|macos\.pkg' dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate
          path: |
            dist/SHA256SUMS
            dist/*.exe
            dist/*.pkg
            dist/*.xpi
            dist/*.deb
            dist/*.mcpb
            dist/*.zip
            dist/*.tar.gz
            dist/*.spdx.json
          retention-days: 7

  # A release tag: completes the draft release that the release job
  # recorded with the installers, the pkg and the completed SHA256SUMS once
  # sums has checked them. When an installer job, sums or this job fails,
  # the draft stays and "Re-run failed jobs" runs them and this job again;
  # the upload replaces what an earlier attempt left. Only a failed release
  # job loses its draft (normally to its own cleanup step; the last step
  # here is a fallback). Besides release, the only job that may write.
  publish:
    needs: [release, windows-installer, macos-pkg, sums]
    if: ${{ always() && !inputs.reuse_run && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload to, or delete, the draft release
    steps:
      - if: ${{ needs.release.result == 'success' && needs.sums.result == 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: release-candidate
      # gh release upload finds the release by tag, so first check that the
      # tag's one release is still the draft the release job recorded.
      - name: Add the installers, the pkg and the completed SHA256SUMS to the draft release
        if: ${{ needs.release.result == 'success' && needs.sums.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        run: |
          set -eu
          [ -n "$RELEASE_ID" ] || { echo "::error::the release job recorded no draft release id"; exit 1; }
          found=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.tag_name == env.TAG) | "\(.id) \(.draft)"')
          if [ "$found" != "$RELEASE_ID true" ]; then
            echo "::error::the releases with the tag $TAG are not just the draft $RELEASE_ID:"
            echo "$found"
            exit 1
          fi
          cd release-candidate
          gh release upload "$TAG" ./*-setup.exe ./*-macos.pkg SHA256SUMS --clobber
          echo "draft release $RELEASE_ID of $TAG is complete"
      - name: Keep the draft release for a re-run when a later job failed
        if: ${{ needs.release.result == 'success' && needs.sums.result != 'success' }}
        env:
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        run: |
          echo "::error::an installer job or sums did not succeed; draft release $RELEASE_ID is kept. Use \"Re-run failed jobs\" to finish it."
          exit 1 # the release is not complete
      - name: Delete the release job's draft release when that job failed
        if: ${{ needs.release.result != 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        run: |
          set -eu
          if [ -n "$RELEASE_ID" ]; then
            draft=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .draft || echo missing)
            if [ "$draft" = true ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
              echo "deleted the draft release $RELEASE_ID; the tag is kept"
            else
              echo "release $RELEASE_ID is not a draft ($draft); nothing deleted"
            fi
          else
            echo "no draft release recorded by the release job; nothing deleted"
          fi
          exit 1 # the release is not complete

  e2e-windows:
    needs: windows-installer
    if: ${{ !cancelled() && (needs.windows-installer.result == 'success' || inputs.reuse_run) && inputs.e2e != 'macos' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: test/e2e/go.mod
          cache: false # this workflow also builds releases; no shared cache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-win
          path: dist-win
          run-id: ${{ inputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Install Thunderbird, psutil and GreenMail (runner only)
        run: |
          $ErrorActionPreference = 'Stop'
          choco install thunderbird -y --no-progress
          $tb = "$env:ProgramFiles\Mozilla Thunderbird\thunderbird.exe"
          $v = (Get-Item $tb).VersionInfo.ProductVersion
          "Thunderbird $v"
          "- Thunderbird installed by Chocolatey: $v" >> $env:GITHUB_STEP_SUMMARY
          if ([int]($v.Split('.')[0]) -lt 153) { throw "Thunderbird $v is older than 153" }
          "MFT_E2E_THUNDERBIRD=$tb" >> $env:GITHUB_ENV
          python -m pip install --disable-pip-version-check --require-hashes --only-binary :all: -r test/e2e/platform/requirements.txt
          $jar = "$env:RUNNER_TEMP\greenmail-standalone.jar"
          curl.exe -fsSL -o $jar $env:GREENMAIL_URL
          if ((Get-FileHash $jar -Algorithm SHA256).Hash -ne $env:GREENMAIL_SHA256) { throw "GreenMail checksum mismatch" }
          "MFT_E2E_GREENMAIL=$jar" >> $env:GITHUB_ENV
      - name: Install the host with the installer
        run: |
          $setup = (Get-ChildItem dist-win -Filter '*-windows-amd64-setup.exe').FullName
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exited $($p.ExitCode)" }
          "MFT_E2E_BIN=$env:LOCALAPPDATA\Programs\MCP for Thunderbird\mcp-for-thunderbird.exe" >> $env:GITHUB_ENV
      # TestE2ERead and TestE2EOrganise unless e2e_tests names others; the
      # job summary records the tests and the Thunderbird version.
      - name: End-to-end tests
        env:
          MFT_E2E_RUN: ${{ inputs.e2e_tests }}
        run: python test/e2e/platform/e2e.py run -v

  e2e-macos:
    needs: macos-pkg
    if: ${{ !cancelled() && (needs.macos-pkg.result == 'success' || inputs.reuse_run) && inputs.e2e != 'windows' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: test/e2e/go.mod
          cache: false # this workflow also builds releases; no shared cache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-mac
          path: dist-mac
          run-id: ${{ inputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Install Thunderbird, psutil and GreenMail (runner only)
        run: |
          set -eu
          # The thunderbird@esr cask is still on ESR 140; the release
          # channel is 153 or later, like Chocolatey's thunderbird.
          brew install --cask thunderbird
          app=$(ls -d /Applications/Thunderbird*.app | head -1)
          v=$(defaults read "$app/Contents/Info.plist" CFBundleShortVersionString)
          echo "Thunderbird $v at $app"
          echo "- Thunderbird installed by Homebrew: $v" >>"$GITHUB_STEP_SUMMARY"
          [ "${v%%.*}" -ge 153 ] || { echo "Thunderbird $v is older than 153"; exit 1; }
          echo "MFT_E2E_THUNDERBIRD=$app/Contents/MacOS/thunderbird" >>"$GITHUB_ENV"
          python -m pip install --disable-pip-version-check --require-hashes --only-binary :all: -r test/e2e/platform/requirements.txt
          jar="$RUNNER_TEMP/greenmail-standalone.jar"
          curl -fsSL -o "$jar" "$GREENMAIL_URL"
          echo "$GREENMAIL_SHA256  $jar" | shasum -a 256 -c -
          echo "MFT_E2E_GREENMAIL=$jar" >>"$GITHUB_ENV"
      - name: Install the host with the pkg
        run: |
          set -eu
          installer -pkg dist-mac/*.pkg -target CurrentUserHomeDirectory
          echo "MFT_E2E_BIN=$HOME/Library/Application Support/MCP for Thunderbird/mcp-for-thunderbird" >>"$GITHUB_ENV"
      # TestE2ERead and TestE2EOrganise unless e2e_tests names others; the
      # job summary records the tests and the Thunderbird version.
      - name: End-to-end tests
        env:
          MFT_E2E_RUN: ${{ inputs.e2e_tests }}
        run: python test/e2e/platform/e2e.py run -v
